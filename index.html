<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Blockly Web Builder GPT - 可视化拖拽建站工具，基于 Google Blockly 与 GPT AI 能力" />
  <title>Blockly Web Builder GPT</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#1a1a2e}
    .card{background:#fff;max-width:680px;width:90%;padding:48px 40px;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
    .icon{width:72px;height:72px;margin:0 auto 24px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:36px}
    h1{font-size:28px;font-weight:700;text-align:center;margin-bottom:8px}
    .subtitle{text-align:center;color:#6b7280;font-size:15px;margin-bottom:32px}
    .features{display:grid;gap:12px;margin-bottom:32px}
    .feature{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#f9fafb;border-radius:12px;font-size:14px;color:#374151}
    .feature .dot{width:8px;height:8px;border-radius:50%;background:#667eea;flex-shrink:0}
    .downloads{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
    .download{display:block;text-align:center;padding:16px 20px;text-decoration:none;border-radius:12px;font-size:15px;font-weight:600;transition:transform .2s,box-shadow .2s}
    .download:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(102,126,234,.4)}
    .download-demo{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
    .download-release{background:#fff;border:2px solid #667eea;color:#667eea}
    .download-release:hover{background:#f5f3ff}
    .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;margin-left:6px;vertical-align:middle}
    .badge-mit{background:#dbeafe;color:#1e40af}
    .badge-pro{background:#fef3c7;color:#92400e}
    .note{text-align:center;margin-top:16px;font-size:13px;color:#9ca3af}
    .version{text-align:center;margin-top:8px;font-size:12px;color:#d1d5db}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">🧩</div>
    <h1>Blockly Web Builder GPT</h1>
    <p class="subtitle">可视化拖拽建站工具 · AI 驱动 · 开箱即用</p>
    <div class="features">
      <div class="feature"><span class="dot"></span>基于 Google Blockly 的可视化编程界面</div>
      <div class="feature"><span class="dot"></span>GPT AI 辅助代码生成与优化</div>
      <div class="feature"><span class="dot"></span>一键导出生产级前端代码</div>
      <div class="feature"><span class="dot"></span>代码分层 · 混淆加密 · 授权管理</div>
    </div>
    <div class="downloads">
      <a class="download download-demo" href="./blockly-web-builder-demo-v0.1.0.zip">⬇ Demo 版<span class="badge badge-mit">MIT</span></a>
      <a class="download download-release" href="./blockly-web-builder-release-v0.1.0.zip">⬇ Release 版<span class="badge badge-pro">商业</span></a>
    </div>
    <p class="note">Demo 版免费开源 · Release 版需授权码激活</p>
    <p class="version">v0.1.0 · 2026-08-07</p>
  </main>
</body>
</html>
